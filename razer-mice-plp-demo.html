<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Razer Gaming Mice PLP — preset demo</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./blocks/razer-site-header/razer-site-header.css">
    <link rel="stylesheet" href="./blocks/razer-family-rail/razer-family-rail.css">
    <link rel="stylesheet" href="./blocks/razer-promo-bar/razer-promo-bar.css">
    <link rel="stylesheet" href="./blocks/razer-plp-hero/razer-plp-hero.css">
    <link rel="stylesheet" href="./blocks/razer-proof-banner/razer-proof-banner.css">
    <link rel="stylesheet" href="./blocks/razer-plp-intro/razer-plp-intro.css">
    <link rel="stylesheet" href="./blocks/razer-product-explorer/razer-product-explorer.css">
    <link rel="stylesheet" href="./blocks/razer-site-footer/razer-site-footer.css">
  </head>
  <body class="appear">
    <main id="main-content">
      <div class="section razer-site-header-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-site-header-wrapper">
          <div class="razer-site-header block" data-block-name="razer-site-header" data-block-status="loaded">
          </div>
        </div>
      </div>
      <div class="section razer-family-rail-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-family-rail-wrapper">
          <div class="razer-family-rail block" data-block-name="razer-family-rail" data-block-status="loaded">
          </div>
        </div>
      </div>
      <div class="section razer-promo-bar-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-promo-bar-wrapper">
          <div class="razer-promo-bar block" data-block-name="razer-promo-bar" data-block-status="loaded">
          </div>
        </div>
      </div>
      <div class="section razer-plp-hero-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-plp-hero-wrapper">
          <div class="razer-plp-hero block" data-block-name="razer-plp-hero" data-block-status="loaded">
          </div>
        </div>
      </div>
      <div class="section razer-proof-banner-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-proof-banner-wrapper">
          <div class="razer-proof-banner block" data-block-name="razer-proof-banner" data-block-status="loaded">
          </div>
        </div>
      </div>
      <div class="section razer-plp-intro-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-plp-intro-wrapper">
          <div class="razer-plp-intro block" data-block-name="razer-plp-intro" data-block-status="loaded">
          </div>
        </div>
      </div>
      <div class="section razer-product-explorer-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-product-explorer-wrapper">
          <div class="razer-product-explorer block" data-block-name="razer-product-explorer" data-block-status="loaded">
          </div>
        </div>
      </div>
      <div class="section razer-site-footer-container appear" data-section-status="loaded" style="display: block">
        <div class="razer-site-footer-wrapper">
          <div class="razer-site-footer block" data-block-name="razer-site-footer" data-block-status="loaded">
          </div>
        </div>
      </div>
    </main>
    <script type="module">
      import decorate0 from './blocks/razer-site-header/razer-site-header.js';
      import decorate1 from './blocks/razer-family-rail/razer-family-rail.js';
      import decorate2 from './blocks/razer-promo-bar/razer-promo-bar.js';
      import decorate3 from './blocks/razer-plp-hero/razer-plp-hero.js';
      import decorate4 from './blocks/razer-proof-banner/razer-proof-banner.js';
      import decorate5 from './blocks/razer-plp-intro/razer-plp-intro.js';
      import decorate6 from './blocks/razer-product-explorer/razer-product-explorer.js';
      import decorate7 from './blocks/razer-site-footer/razer-site-footer.js';

      decorate0(document.querySelector('.razer-site-header.block'));
      decorate1(document.querySelector('.razer-family-rail.block'));
      decorate2(document.querySelector('.razer-promo-bar.block'));
      decorate3(document.querySelector('.razer-plp-hero.block'));
      decorate4(document.querySelector('.razer-proof-banner.block'));
      decorate5(document.querySelector('.razer-plp-intro.block'));
      decorate6(document.querySelector('.razer-product-explorer.block'));
      decorate7(document.querySelector('.razer-site-footer.block'));
    </script>
  </body>
</html>
